url: https://dhis2-chap.github.io/chap_r_sdk/

template:
  bootstrap: 5

home:
  title: CHAP R SDK
  description: Tools for building CHAP-compatible disease forecasting models

navbar:
  structure:
    left:  [getting-started, tutorials, reference, news]
    right: [search, github]
  components:
    getting-started:
      text: Getting Started
      href: articles/getting-started.html
    tutorials:
      text: Tutorials
      menu:
        - text: Building Your First CHAP Model
          href: articles/model-development-tutorial.html
        - text: Working with Spatio-Temporal Data
          href: articles/spatio-temporal-data.html

reference:
  - title: CLI Interface
    desc: Create command-line interfaces for CHAP models
    contents:
      - create_chap_cli
      - build_run_info

  - title: Configuration
    desc: Model configuration management
    contents:
      - read_model_config
      - write_model_config
      - get_config_param
      - create_config_schema
      - validate_config
      - apply_config_defaults
      - get_schema_defaults

  - title: Configuration Schema Builders
    desc: Helper functions to build JSON Schema configuration schemas
    contents:
      - schema_string
      - schema_number
      - schema_integer
      - schema_boolean
      - schema_array
      - schema_enum
      - schema_to_json
      - print.chap_config_schema

  - title: Model Validation
    desc: Test and validate CHAP model implementations
    contents:
      - run_model_tests
      - validate_model_io
      - validate_model_io_all
      - validate_model_output

  - title: Spatio-Temporal Data
    desc: Utilities for working with spatio-temporal data
    contents:
      - transform_spatiotemporal
      - aggregate_spatial
      - aggregate_temporal

  - title: Prediction Samples
    desc: Convert between prediction sample formats
    contents:
      - predictions_from_wide
      - predictions_to_wide
      - predictions_from_long
      - predictions_to_long
      - predictions_to_quantiles
      - predictions_summary
      - has_prediction_samples
      - detect_prediction_format

  - title: Example Models
    desc: Reference model implementations
    contents:
      - train_mean_model
      - predict_mean_model

  - title: Environment
    desc: Docker and renv environment configuration for containerized models
    contents:
      - init_chap_env
      - generate_dockerfile
      - generate_mlproject
      - detect_system_deps
      - read_renv_r_version

  - title: Utilities
    desc: Helper functions
    contents:
      - get_example_data
